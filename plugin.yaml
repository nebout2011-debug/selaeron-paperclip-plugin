name: selaeron-paperclip-sel9
version: 0.1.0
description: "Approved, comment-only Paperclip writeback for Hermes, bound to the current Paperclip run ID."
author: SELAERON Labs
kind: tool
requires_hermes: ">=0.21.6"
requires_env:
  - PAPERCLIP_API_URL
  - PAPERCLIP_API_KEY
  - PAPERCLIP_APPROVED_ORIGIN
  - PAPERCLIP_APPROVED_ISSUES
provides_tools:
  - selaeron_paperclip_sel9_comment
