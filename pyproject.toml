[project]
name = "paperclip-comment-plugin"
version = "0.1.0"
requires-python = ">=3.10"
description = "Comment-only Paperclip writeback plugin for Hermes, bound to the current Paperclip run ID."

[tool.setuptools]
packages = ["hermes_integration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
